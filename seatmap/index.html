<!DOCTYPE html><html><head><meta charset="utf-8">
<style>body{margin:0;padding:0 2px 4px 0;font-family:sans-serif;box-sizing:border-box}svg{width:calc(100% - 2px);height:auto;display:block;border:1px solid #ddd;border-radius:8px;background:#fff}
.seat{cursor:pointer}.seat:hover rect{stroke-width:3}.taken{cursor:not-allowed}
.legend{font-size:12px;color:#444;margin-top:4px}</style></head><body>
<div id="root"></div>
<script>
function send(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data),"*")}
function setHeight(){send("streamlit:setFrameHeight",{height:document.body.scrollHeight+8})}
function render(a){
  const {img,w,h,seats,taken,me}=a;
  let g="";
  const ZONE={LSS:"#22a7e0",SCC:"#7dc855",CSO:"#f2b722",CGM:"#6a3ba8"};
  for(const s of seats){
    const o=taken[s.id]; let fill,label,cls="seat",txt="#fff";
    const hw=(s.w||44)/2, hh=(s.h||40)/2;
    if(o===me){fill="#2563eb";label="나"}
    else if(o){fill="#9ca3af";label=o;cls="seat taken"}
    else{fill=ZONE[s.zone]||"#22c55e";label=s.id;txt=s.zone==="CSO"?"#333":"#fff"}
    // 라벨은 잘라내지 않고 칸 폭에 맞춰 축소한다 (textLength로 폭 고정)
    const maxW=hw*2-3, est=label.length*(/[가-힣]/.test(label)?7:5);
    const fit=est>maxW?`textLength="${maxW}" lengthAdjust="spacingAndGlyphs"`:"";
    g+=`<g class="${cls}" data-id="${s.id}" data-taken="${o?1:0}">
        <rect x="${s.x-23}" y="${s.y-21}" width="46" height="42" fill="transparent"/>
        <rect x="${s.x-hw}" y="${s.y-hh}" width="${hw*2}" height="${hh*2}" rx="2" fill="${fill}" stroke="#1f2937" stroke-width="0.8"/>
        <text x="${s.x}" y="${s.y+2.5}" font-size="7" text-anchor="middle" fill="${txt}" font-weight="bold" ${fit}>${label}</text>
        <title>${s.id} · ${s.zone} · ${o||"빈 자리 — 클릭하면 선점"}</title></g>`;
  }
  document.getElementById("root").innerHTML=
   `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><image href="data:image/png;base64,${img}" width="${w}" height="${h}"/>${g}</svg>
    <div class="legend"><span style="color:#22a7e0">■</span><span style="color:#7dc855">■</span><span style="color:#f2b722">■</span><span style="color:#6a3ba8">■</span> 빈 자리(클릭하면 선점) &nbsp;<span style="color:#9ca3af">■</span> 선점됨 &nbsp;<span style="color:#2563eb">■</span> 내 자리(클릭하면 취소)</div>`;
  document.querySelectorAll(".seat").forEach(el=>el.onclick=()=>{
    const id=el.dataset.id, o=taken[id];
    if(o && o!==me) return;
    send("streamlit:setComponentValue",{value:{seat:id,nonce:Date.now()},dataType:"json"});
  });
  setHeight();
}
window.addEventListener("message",e=>{if(e.data.type==="streamlit:render")render(e.data.args)});
window.addEventListener("resize",setHeight);
send("streamlit:componentReady",{apiVersion:1});
</script></body></html>
